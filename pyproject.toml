[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "islamic-rag"
version = "0.2.0"
description = "Provenance-focused Arabic/English RAG prototype for Islamic source texts"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "qdrant-client>=1.10",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.5",
    "ijson>=3.2",
]

[project.optional-dependencies]
ml = [
    "torch",
    "transformers>=4.44",
    "accelerate",
    "sentence-transformers>=3.0",
]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
islamic-rag-build = "islamic_rag.build_index:main"
islamic-rag-chat = "islamic_rag.chat:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
